# Local integration over the production stack with alternative port 8080
services:
  nginx:
    ports: !override
      - "8080:80"
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/site:ro
      - ./media:/app/media:ro
