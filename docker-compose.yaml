services:
  backend_rope_shopo:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_rope_shopo
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8018 --reload"
    ports:
      - "8018:8018"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres_rope_shopo
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456789}
      POSTGRES_DB: ${DB_NAME:-api_rope_shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-api_rope_shop}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_rope_shopo
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_rope_shopo
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/site:ro
      - ./media:/app/media:ro
    depends_on:
      - backend_rope_shopo
    restart: unless-stopped

volumes:
  postgres_data:
