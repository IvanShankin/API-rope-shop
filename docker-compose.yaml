services:
  backend_rope_shopo:
    build: .
    container_name: backend_rope_shopo
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8018
    ports:
      - "8018:8018"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped  # Автоперезапуск при падении

  postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
