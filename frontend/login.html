<!doctype html>
<html lang="ru" class="login-page">

<head>
  <meta charset="utf-8">
  <script src="/js/api/remote-api.js?v=20261029.1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в панель управления — Rope-Pro-Line</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" href="/img/favicon-64.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/admin.css?v=20261027.10">
  <script type="module" src="/js/app.js?v=20261028.17"></script>
  <link rel="stylesheet" href="/css/custom-selects.css?v=20261027.10">
  <script type="module" src="/js/ui/custom-selects.js?v=20261027.10"></script>
</head>

<body class="admin-page__body">
  <main class="admin-auth-screen" role="main">
    <div class="admin-auth-card">
      <div class="admin-auth-logo">
        <img srcset="/img/logo.mobile.webp 768w, /img/logo.optimized.webp 925w" sizes="(max-width: 767px) 100vw, 100vw" src="/img/logo.optimized.webp" alt="Rope-Pro-Line" width="120" height="82">
        <h1 class="admin-auth-title">Rope-Pro-Line</h1>
        <p class="admin-auth-subtitle">Панель управления Spleiße Atelier</p>
      </div>

      <form class="admin-auth-form" id="admin-login-form" novalidate autocomplete="off">
        <div class="admin-auth-field">
          <label class="admin-auth-label" for="auth-username">Логин или Email</label>
          <div class="admin-auth-input-wrap">
            <svg class="admin-auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input
              type="text"
              id="auth-username"
              name="username"
              class="admin-auth-input"
              placeholder="admin"
              required
              autofocus
              autocomplete="username"
            />
          </div>
        </div>

        <div class="admin-auth-field">
          <label class="admin-auth-label" for="auth-password">Пароль</label>
          <div class="admin-auth-input-wrap">
            <svg class="admin-auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input
              type="password"
              id="auth-password"
              name="password"
              class="admin-auth-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="admin-auth-error" id="auth-error-msg" role="alert"></div>

        <button type="submit" class="admin-auth-btn" id="auth-submit-btn">
          <span class="btn-text">Войти в панель</span>
        </button>
      </form>

      <div class="admin-auth-footer">
        <a href="/">← Вернуться на главный сайт</a>
      </div>
    </div>
  </main>
</body>

</html>
