upstream backend_api {
    server backend_rope_shopo:8018;
    keepalive 32;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 1. HTTP Server - ACME challenge & HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name rope-pro-line.com www.rope-pro-line.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Default HTTP Server for raw IP access
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://rope-pro-line.com$request_uri;
    }
}

# 3. HTTPS Server - Main Production Site & API
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name rope-pro-line.com www.rope-pro-line.com;

    ssl_certificate /etc/letsencrypt/live/rope-pro-line.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rope-pro-line.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /site;
    index index.html;
    absolute_redirect off;
    client_max_body_size 25M;

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr_limit 30;

        proxy_pass http://backend_api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(docs|openapi\.json|redoc) {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";

        location ~ /\.(?!well-known).* {
            deny all;
        }

        try_files $uri =404;
    }

    location /assets/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /$is_args$args; }
    location = /index/ { return 301 /$is_args$args; }
    location = /index { return 301 /$is_args$args; }

    location ~ ^/order-tracking/[^/]+/?$ {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        access_log off;
        try_files /order-tracking.html =404;
    }

    location ~ ^/(admin|b2b|b2c|catalog|category|configurator|legal|login)\.html$ { return 301 /$1/$is_args$args; }
    location ~ ^/(admin|b2b|b2c|catalog|category|configurator|legal|login)$ { return 301 /$1/$is_args$args; }
    location ~ ^/(admin|b2b|b2c|catalog|category|configurator|legal|login)/$ { try_files /$1.html =404; }
    location ~ ^/(css|js|img)/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
