# Upstream definition for FastAPI (Uvicorn)
upstream backend_api {
    server backend_rope_shopo:8018;
    keepalive 32;
}

# 1. HTTP Server - ACME challenge & HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Main Production Virtual Host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;  # Замените на ваш домен, например: api.rope-shop.com

    # SSL Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Global Max Body Size for File Uploads (Product photos, etc.)
    client_max_body_size 25M;

    # Static Media Files (Uploaded product photos, splice types, work photos, etc.)
    location /media/ {
        alias /app/media/;
        autoindex off;

        # Caching headers for client browsers and CDNs
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";

        # CORS for media assets
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";

        # Deny access to hidden/executable files inside media
        location ~ /\.(?!well-known).* {
            deny all;
        }

        try_files $uri =404;
    }

    # Health Check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Reverse Proxy to FastAPI Backend
    location / {
        # Rate Limiting at Nginx layer
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr_limit 30;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Essential headers for FastAPI, CORS and Rate Limiting (SlowAPI)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
