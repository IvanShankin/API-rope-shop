upstream backend_api {
    server backend_rope_shopo:8018;
    keepalive 32;
}

# Preserve upstream proto from ngrok/proxies if provided
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    # Let's Encrypt / Certbot ACME challenge (if ever needed)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Static Media Files (Uploaded product photos, etc.)
    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";

        location ~ /\.(?!well-known).* {
            deny all;
        }

        try_files $uri =404;
    }

    # Health Check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Reverse Proxy to FastAPI
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr_limit 30;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
